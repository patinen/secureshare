name: secureshare
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secureshare_local
      POSTGRES_PASSWORD: local_development_only
      POSTGRES_DB: secureshare_local
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureshare_local"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
  api:
    image: golang:1.26-bookworm
    working_dir: /app
    volumes: ["./api:/app", "go_modules:/go/pkg/mod", "go_build:/root/.cache/go-build"]
    command: go run ./cmd/server
    env_file: ./api/.env
    environment:
      DATABASE_URL: postgres://secureshare_local:local_development_only@postgres:5432/secureshare_local?sslmode=disable
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
  go_modules:
  go_build:
